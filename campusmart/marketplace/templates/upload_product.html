<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Product - CampusMart</title>
    <style>
        /* Modern Pastel & UI Variables */
        :root {
            --primary-blue: #4a90e2;
            --pastel-bg: #f0f4f8;      
            --pastel-success: #10b981; 
            --back-btn-bg: #e0e7ff;    
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --navbar-dark: #1a1c23;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--pastel-bg); 
            min-height: 100vh; 
            color: var(--text-dark);
        }

        /* Large Professional Navbar */
        .navbar { 
            background: var(--navbar-dark); 
            padding: 18px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); 
        }
        .logo { 
            color: var(--white); 
            font-size: 1.8em; 
            font-weight: 800; 
            text-decoration: none; 
            cursor: pointer;
        }
        
        .user-icon-container {
            background: var(--primary-blue);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-icon-container svg { fill: var(--white); width: 24px; height: 24px; }

        /* Container & Layout */
        .container { max-width: 750px; margin: 30px auto; padding: 0 20px; }

        /* Colored Back Button */
        .back-btn { 
            background: var(--back-btn-bg); 
            color: #4338ca; 
            padding: 10px 22px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 0.9em;
            margin-bottom: 20px; 
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(67, 56, 202, 0.1);
        }
        .back-btn:hover { background: #d0d7f7; transform: translateY(-2px); }

        .upload-container { 
            background: var(--white); 
            border-radius: 24px; 
            padding: 40px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); 
        }

        .upload-header { text-align: center; margin-bottom: 30px; }
        .upload-header h1 { font-size: 2.2em; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
        .upload-header p { color: var(--text-muted); font-size: 1em; }

        /* Progress & Steps */
        .progress-bar { width: 100%; height: 8px; background: #eef2f7; border-radius: 10px; margin-bottom: 35px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-blue); width: 33.33%; transition: width 0.4s ease; }

        .upload-steps { display: flex; justify-content: space-around; margin-bottom: 35px; }
        .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .step-number { 
            width: 36px; height: 36px; border-radius: 50%; background: #f1f5f9; color: #94a3b8; 
            display: flex; align-items: center; justify-content: center; font-weight: 700; 
        }
        .step-number.active { background: var(--primary-blue); color: var(--white); }
        .step-number.completed { background: var(--pastel-success); color: var(--white); }
        .step-text { font-size: 0.85em; font-weight: 700; color: var(--text-muted); }

        /* Forms */
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeInUp 0.5s ease; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #334155; }
        .form-control { 
            width: 100%; padding: 14px 18px; border: 2px solid #f1f5f9; border-radius: 14px; 
            font-size: 15px; transition: all 0.3s; background: #f8fafc; 
        }
        .form-control:focus { outline: none; border-color: var(--primary-blue); background: var(--white); }

        /* Image Upload Area */
        .image-upload-area { 
            border: 2px dashed var(--primary-blue); 
            border-radius: 18px; 
            padding: 50px; 
            text-align: center; 
            background: #fbfcfe; 
            cursor: pointer;
            transition: 0.3s;
        }
        .image-upload-area:hover { background: #f0f7ff; }
        .image-preview { display: none; width: 100%; max-height: 300px; object-fit: contain; border-radius: 18px; margin-top: 15px; border: 1px solid #e2e8f0; }

        /* Navigation Buttons */
        .navigation-buttons { display: flex; justify-content: space-between; margin-top: 40px; gap: 20px; }
        .btn { padding: 16px 30px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; flex: 1; font-size: 1em; text-align: center; }
        .btn-primary { background: var(--primary-blue); color: var(--white); }
        .btn-secondary { background: #f1f5f9; color: #64748b; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='/dashboard/'">CampusMart</div>
        <div class="user-icon-container">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
    </nav>

    <div class="container">
        <a href="/dashboard/" class="back-btn">← Back to Dashboard</a>
        
        <div class="upload-container">
            <div class="upload-header">
                <h1>List New Item</h1>
                <p>Share your items with the campus community</p>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="upload-steps">
                <div class="step">
                    <div class="step-number active" id="step-1">1</div>
                    <span class="step-text">Photo</span>
                </div>
                <div class="step">
                    <div class="step-number" id="step-2">2</div>
                    <span class="step-text">Details</span>
                </div>
                <div class="step">
                    <div class="step-number" id="step-3">3</div>
                    <span class="step-text">Review</span>
                </div>
            </div>

            <form id="upload-form" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="form-section active" id="section-1">
                    <div class="form-group">
                        <label>Product Image *</label>
                        <div class="image-upload-area" id="upload-box" onclick="document.getElementById('image-input').click()">
                            <span style="font-size: 2.5em;">📸</span>
                            <p style="color: var(--primary-blue); font-weight: 700; margin-top: 10px;">Click to upload image</p>
                        </div>
                        <input type="file" id="image-input" name="image" accept="image/*" style="display: none;" required>
                        <img id="image-preview" class="image-preview" alt="Preview">
                    </div>
                </div>

                <div class="form-section" id="section-2">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="title" name="title" class="form-control" placeholder="What are you selling?" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="category" name="category" class="form-control" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="1">Books</option>
                            <option value="2">Sports</option>
                            <option value="3">Electronics</option>
                            <option value="4">Others</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="cost" name="cost" class="form-control" placeholder="0" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="description" name="description" class="form-control" rows="3" placeholder="Condition, age, etc..." required></textarea>
                    </div>
                </div>

                <div class="form-section" id="section-3">
                    <div id="review-content"></div>
                </div>

                <div class="navigation-buttons">
                    <button type="button" class="btn btn-secondary" id="prev-btn" onclick="previousStep()" style="display: none;">Previous</button>
                    <button type="button" class="btn btn-primary" id="next-btn" onclick="nextStep()">Next Step</button>
                    <button type="submit" class="btn btn-primary" id="submit-btn" style="display: none;">Publish Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');
        const uploadBox = document.getElementById('upload-box');

        // FIXED: Image Preview Handling
        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    uploadBox.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function nextStep() {
            if (validateStep()) {
                if (currentStep < totalSteps) {
                    currentStep++;
                    if (currentStep === 3) generateReview();
                    updateUI();
                }
            }
        }

        function previousStep() {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
            }
        }

        function validateStep() {
            if (currentStep === 1 && !imageInput.files[0]) {
                alert("Please upload an image.");
                return false;
            }
            if (currentStep === 2) {
                const fields = ['title', 'category', 'cost', 'description'];
                for (let id of fields) {
                    if (!document.getElementById(id).value) {
                        alert("Please fill all fields.");
                        return false;
                    }
                }
            }
            return true;
        }

        function generateReview() {
            const title = document.getElementById('title').value;
            const price = document.getElementById('cost').value;
            const desc = document.getElementById('description').value;
            const cat = document.getElementById('category').options[document.getElementById('category').selectedIndex].text;

            document.getElementById('review-content').innerHTML = `
                <div style="text-align: center;">
                    <img src="${imagePreview.src}" style="max-height: 180px; border-radius: 12px; margin-bottom: 15px;">
                    <h3 style="margin-bottom: 5px;">${title}</h3>
                    <p style="color: var(--primary-blue); font-weight: 700; margin-bottom: 10px;">${cat} • ₹${price}</p>
                    <div style="background: #f8fafc; padding: 15px; border-radius: 12px; text-align: left; font-size: 0.9em;">
                        <strong>Description:</strong><br>${desc}
                    </div>
                </div>
            `;
        }

        function updateUI() {
            document.querySelectorAll('.form-section').forEach((s, i) => s.classList.toggle('active', i+1 === currentStep));
            document.getElementById('progress-fill').style.width = (currentStep/totalSteps * 100) + "%";
            document.getElementById('prev-btn').style.display = currentStep === 1 ? 'none' : 'block';
            document.getElementById('next-btn').style.display = currentStep === 3 ? 'none' : 'block';
            document.getElementById('submit-btn').style.display = currentStep === 3 ? 'block' : 'none';
            
            for(let i=1; i<=totalSteps; i++) {
                const step = document.getElementById('step-'+i);
                step.classList.toggle('active', i === currentStep);
                step.classList.toggle('completed', i < currentStep);
                step.innerHTML = i < currentStep ? "✓" : i;
            }
        }
    </script>
</body>
</html>
