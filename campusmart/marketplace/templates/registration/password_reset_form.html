{% extends "base_auth.html" %}

{% block content %}
<div class="auth-container">
    <div class="logo">CampusMart</div>
    <h2>Forgot Password?</h2>
    <p>No worries! Enter your email below and we'll send you a link to reset your password.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_email">Email Address</label>
            <input type="email" name="email" id="id_email" placeholder="Enter your email" required autofocus>
        </div>
        <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}" class="btn-secondary">Back to Login</a>
</div>
{% endblock %}
