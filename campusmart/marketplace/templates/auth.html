<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMart - Login & Signup</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ================= BODY + BACKGROUND IMAGE ================= */
        body {
            font-family: 'Segoe UI', sans-serif;

            /* Background image */
            background-image: url("{% static 'marketplace/images/images/image.jpg' %}");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* Overlay for readability */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            pointer-events: none;
            z-index: 0;
        }

        /* Glass/transparent container */
        .auth-container {
            background: rgba(255,255,255,0.22);
            border-radius: 20px;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.35);
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2em;
            font-weight: bold;
            color: #4a90e2;
            margin-bottom: 20px;
        }

        .auth-tabs {
            display: flex;
            background: rgba(255,255,255,0.4);
            border-radius: 25px;
            margin-bottom: 25px;
            padding: 5px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            background: none;
        }
        .tab-btn.active {
            background: linear-gradient(135deg,#4a90e2,#357abd);
            color: white;
        }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg,#4a90e2,#357abd);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:hover { opacity: 0.9; }

        .alert {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
        }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo">CampusMart</div>

    <!-- Tabs -->
    <div class="auth-tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="alerts"></div>

    <!-- Login -->
    <div id="login-section" class="form-section active">
        <div class="form-group">
            <label>Email or Username</label>
            <input type="text" id="login-username" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required>
        </div>
        <button class="btn-primary" onclick="loginUser()">Login</button>
    </div>

    <!-- Register (simplified) -->
    <div id="signup-section" class="form-section">
        <div class="form-group"><label>Name</label>
            <input type="text" id="name" required></div>
        <div class="form-group"><label>Email</label>
            <input type="email" id="email" required></div>
        <div class="form-group"><label>Password</label>
            <input type="password" id="password1" required></div>
        <div class="form-group"><label>Confirm Password</label>
            <input type="password" id="password2" required></div>
        <button class="btn-primary" onclick="registerUser()">Register</button>
    </div>

    <!-- OTP -->
    <div id="otp-section" class="form-section">
        <h3>Verify Account</h3>
        <p>Enter the 6-digit code sent to your email</p>
        <input type="text" id="otp-input" maxlength="6" required>
        <button class="btn-primary" onclick="verifyOtp()">Verify</button>
    </div>
</div>

<script>
const csrftoken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

// Switch between login/signup tabs
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
    document.getElementById(tab+'-section').classList.add('active');
    document.getElementById('alerts').innerHTML = '';
}

// Alerts
function showAlert(msg,type){
    let a=document.getElementById('alerts');
    a.innerHTML=`<div class="alert alert-${type}">${msg}</div>`;
    setTimeout(()=>a.innerHTML='',4000);
}

// ---------------------- LOGIN ----------------------
function loginUser(){
    const data = {
        username: document.getElementById('login-username').value,
        password: document.getElementById('login-password').value
    };

    fetch('/login/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken
        },
        credentials: 'same-origin',
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
        if(res.status === 'success'){
            window.location.href = res.redirect;
        } else {
            showAlert(res.message, 'error');
        }
    })
    .catch(err => console.error('Login error:', err));
}

// ---------------------- REGISTER ----------------------
function registerUser(){
    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password1: document.getElementById('password1').value,
        password2: document.getElementById('password2').value
    };
    fetch('/register/', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRFToken':csrftoken},
        credentials: 'same-origin',
        body:JSON.stringify(data)
    })
    .then(r => r.json())
    .then(res => {
        if(res.status==='success'){
            showAlert('Registration successful! Wait for admin approval.','success');
            switchTab('login');
        } else if (res.errors) {
            showAlert(Object.values(res.errors).join('<br>'), 'error');
        } else {
            showAlert(res.message || 'Something went wrong.', 'error');
        }
    })
    .catch(err => console.error('Register error:', err));
}
</script>

</body>
</html>
