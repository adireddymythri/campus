services:
  - type: web
    name: campusmart
    env: python
    buildCommand: pip install -r campusmart/requirements.txt && python manage.py collectstatic --noinput
    startCommand: cd campusmart && gunicorn campusmart.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SETTINGS_MODULE
        value: campusmart.settings_production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: campusmart.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: campusmart-db
          property: connectionString
    healthCheckPath: /

databases:
  - name: campusmart-db
    databaseName: campusmart
    user: campusmart_user
    plan: free


